apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: preprocessor
  name: preprocessor-daemonset
  namespace: aide-fl
spec:
  selector:
    matchLabels:
      app: preprocessor
  template:
    metadata:
      labels:
        app: preprocessor
        env: dev
    spec:
      nodeSelector:
        fl-role: client
      hostNetwork: true
      containers:

      - name: redis
        image: redis:8.0.2
        command:
        - redis-server
        - "/redis-master/redis.conf"
        env:
        - name: master
          value: "true"
        ports:
        - containerPort: 6379
        volumeMounts:
        - mountPath: /redis-master-data
          name: data
        - mountPath: /redis-master
          name: config

      - name: preprocessor-logic
        image: ghcr.io/martienskienum1/preprocessor-logic:dev

      volumes:
      - name: data
        emptyDir: {}
      - name: config
        configMap:
          name: redis-config
          items:
          - key: redis-config
            path: redis.conf