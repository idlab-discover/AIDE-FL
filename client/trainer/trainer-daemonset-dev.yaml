apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: trainer
  name: trainer-daemonset
  namespace: aide-fl
spec:
  selector:
    matchLabels:
      app: trainer
  template:
    metadata:
      labels:
        app: trainer
        env: dev
    spec:
      nodeSelector:
        fl-role: client
      hostNetwork: true
      containers:

      - name: flower-supernode
        image: flwr/supernode:1.27.0
        ports:
        - containerPort: 9094
          name: clientappio-api
        env:
        - name: SERVER_IP
          valueFrom:
            configMapKeyRef:
              name: server-ip
              key: SERVER_IP
        args: ["--root-certificates", "certs/ca.crt", "--superlink", "$(SERVER_IP):9092", "--clientappio-api-address", "0.0.0.0:9094", "--isolation", "process"]
        volumeMounts:
        - name: ca-cert
          mountPath: /app/certs

      - name: flower-clientapp
        image: ghcr.io/str-gen/flower-clientapp:dev
        volumeMounts:
        - mountPath: /app/share
          name: trainer-share
        args: ["--insecure", "--clientappio-api-address", "localhost:9094"]

      - name: trainer-logic
        image: ghcr.io/str-gen/trainer-logic:dev
        volumeMounts:
        - mountPath: /app/share
          name: trainer-share

      volumes:
      - name: trainer-share
        emptyDir: {}
      - name: ca-cert
        configMap:
          name: ca-cert
