apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: trainer
  name: trainer-daemonset
  namespace: aide-fl
spec:
  selector:
    matchLabels:
      app: trainer
  template:
    metadata:
      labels:
        app: trainer
    spec:
      nodeSelector:
        fl-role: client
      hostNetwork: true
      containers:
      - name: flower-supernode
        image: flwr/supernode:1.18.0
        ports:
        - containerPort: 9094
          name: clientappio-api
        env:
        - name: NODE_IP
          valueFrom:
            configMapKeyRef:
              name: node-ip
              key: NODE_IP
        args: ["--insecure", "--superlink", "$(NODE_IP):9092", "--clientappio-api-address", "0.0.0.0:9094", "--isolation", "process"]
      - name: flower-clientapp
        image: ghcr.io/martienskienum1/flower-clientapp:latest
        volumeMounts:
        - mountPath: /app/share
          name: trainer-share
        args: ["--insecure", "--clientappio-api-address", "localhost:9094"]
      - name: trainer-logic
        image: ghcr.io/martienskienum1/trainer-logic:latest
        volumeMounts:
        - mountPath: /app/share
          name: trainer-share
      volumes:
      - name: trainer-share
        emptyDir: {}