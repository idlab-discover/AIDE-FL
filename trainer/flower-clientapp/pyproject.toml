[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flower-clientapp"
version = "1.0.0"
description = ""
license = "Apache-2.0"
dependencies = [
    "tensorflow>=2.11.1,<2.18.0",
    "pandas>=2.2.3",
    "pyarrow>=20.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flower"

[tool.flwr.app.components]
clientapp = "flwr_keras.client_app:app"

[tool.flwr.app.config]
verbose = false

[tool.flwr.federations]
default = "deployment"

[tool.flwr.federations.deployment]
address = "127.0.0.1:9093"
insecure = true