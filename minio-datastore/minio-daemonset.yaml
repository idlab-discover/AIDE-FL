apiVersion: v1
kind: Namespace
metadata:
  name: minio-dev
  labels:
    name: minio-dev

---

apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: minio
  name: minio-daemonset
  namespace: minio-dev
spec:
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio-proxy
        image: ghcr.io/martienskienum1/minio-proxy:latest
      initContainers:
      - name: minio
        image: quay.io/minio/minio:latest
        restartPolicy: Always
        env:
        - name: MINIO_ROOT_USER
          value: aide-fl1
        - name: MINIO_ROOT_PASSWORD
          value: aide-fl1
        command:
        - /bin/bash
        - -c
        args:
        - minio server /data --console-address :9090
        volumeMounts:
        - mountPath: /data
          name: localvolume
      volumes:
      - name: localvolume
        hostPath:
          path: /datasets
          type: DirectoryOrCreate