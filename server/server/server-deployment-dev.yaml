apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-deployment
  namespace: aide-fl
  labels:
    app: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
        env: dev
    spec:
      nodeSelector:
        fl-role: server
      hostNetwork: true
      containers:

      - name: flower-superlink
        image: flwr/superlink:1.43.0
        ports:
        - containerPort: 9092
          name: flower-https
        args: ["--ssl-ca-certfile", "certs/ca.crt", "--ssl-certfile", "certs/server.pem", "--ssl-keyfile", "certs/server.key", "--isolation", "process", "--host", "0.0.0.0", "--port", "9092", "--superexec-auth-secret-file", "/app/superexec-auth/secret", "--disable-runtime-dependency-installation"]
        volumeMounts:
        - name: superexec-auth
          mountPath: /app/superexec-auth
          readOnly: true
        - name: all-certs
          mountPath: /app/certs
          readOnly: true

      - name: flower-serverapp
        image: ghcr.io/idlab-discover/aide-fl/flower-serverapp:dev
        args: ["--root-certificates", "/app/certs/ca.crt", "--runtime-api-address", "localhost:9092", "--superexec-auth-secret-file", "/app/superexec-auth/secret"]
        env:
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-api-key
              key: WANDB_API_KEY
        volumeMounts:
        - name: superexec-auth
          mountPath: /app/superexec-auth
          readOnly: true
        - name: server-share
          mountPath: /app/share
        - name: ca-cert
          mountPath: /app/certs
          readOnly: true

      - name: server-logic
        image: ghcr.io/idlab-discover/aide-fl/server-logic:dev
        volumeMounts:
        - name: server-share
          mountPath: /app/share

      volumes:
      - name: superexec-auth
        secret:
          secretName: flower-superexec-auth
      - name: server-share
        emptyDir: {}
      - name: all-certs
        projected:
          sources:
          - secret:
              name: server-cert
              items:
              - key: tls.crt
                path: server.pem
              - key: tls.key
                path: server.key
          - configMap:
              name: ca-cert
              items:
              - key: ca.crt
                path: ca.crt
      - name: ca-cert
        configMap:
          name: ca-cert
