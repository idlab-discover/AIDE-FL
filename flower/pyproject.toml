[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flower"
version = "1.0.0"
description = ""
requires-python = ">=3.12,<3.14"
license = {file = "LICENSE"}
# Match the unified HTTPS runtime in the deployment manifests.
# TensorFlow 2.20 matches Flower's upstream TensorFlow quickstart.
dependencies = [
    "flwr[dp]>=1.43.0,<1.44.0",
    "tensorflow==2.20.0",
    "torch==2.14.1",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "xgboost==3.4.1",
    "flask==3.1.3",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "wandb==0.31.0",
    "safetensors==0.8.0"
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flower"
fab-format-version = 1
flwr-version-target = "1.43.0"

[tool.flwr.app.components]
serverapp = "flower.server_app:app"
clientapp = "flower.client_app:app"

[tool.flwr.app.config]
verbose = false
