[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flower"
version = "1.0.0"
description = ""
license = "Apache-2.0"
dependencies = [
    "flwr==1.27.0",
    "tensorflow>=2.19.1,<2.20.0",
    "flask>=3.1.1",
    "pandas>=2.2.3",
    "pyarrow>=20.0.0",
    "wandb>=0.20.1",
    "safetensors>=0.5.3"
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flower"

[tool.flwr.app.components]
serverapp = "flower.server_app:app"
clientapp = "flower.client_app:app"

[tool.flwr.app.config]
verbose = false

[tool.flwr.federations]
default = "deployment"

[tool.flwr.federations.deployment]
address = "127.0.0.1:9093"
root-certificates = "./certs/ca.crt"
