name: Publish images
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  flower-bases:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: flower-clientapp-base
            context: flower
            dockerfile: flower/clientapp-base.Dockerfile
          - image: flower-serverapp-base
            context: flower
            dockerfile: flower/serverapp-base.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute package reference
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: |
          owner_lc="${OWNER,,}"
          echo "name=ghcr.io/${owner_lc}/aide-fl/${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${owner_lc}/aide-fl" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
  services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: minio
            context: minio
            dockerfile: minio/Dockerfile
          - image: orchestrator
            context: client/orchestrator
            dockerfile: client/orchestrator/Dockerfile
          - image: datastore-logic
            context: client/datastore/datastore-logic
            dockerfile: client/datastore/datastore-logic/Dockerfile
          - image: preprocessor-logic
            context: client/preprocessor/preprocessor-logic
            dockerfile: client/preprocessor/preprocessor-logic/Dockerfile
          - image: trainer-logic
            context: client/trainer/trainer-logic
            dockerfile: client/trainer/trainer-logic/Dockerfile
          - image: server-logic
            context: server/server/server-logic
            dockerfile: server/server/server-logic/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute package reference
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: |
          owner_lc="${OWNER,,}"
          echo "name=ghcr.io/${owner_lc}/aide-fl/${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${owner_lc}/aide-fl" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
  flower-apps:
    runs-on: ubuntu-latest
    needs: flower-bases
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: flower-clientapp
            context: flower
            dockerfile: flower/clientapp.Dockerfile
            base_image: flower-clientapp-base
          - image: flower-serverapp
            context: flower
            dockerfile: flower/serverapp.Dockerfile
            base_image: flower-serverapp-base
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute package reference
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: |
          owner_lc="${OWNER,,}"
          echo "name=ghcr.io/${owner_lc}/aide-fl/${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${owner_lc}/aide-fl" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            BASE_IMAGE=${{ steps.image.outputs.prefix }}/${{ matrix.base_image }}:sha-${{ github.sha }}
